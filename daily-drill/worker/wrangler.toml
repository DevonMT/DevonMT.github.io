name = "daily-drill-sync"
main = "src/index.js"
compatibility_date = "2026-09-04"

# Deployed to a route on the zone rather than a workers.dev subdomain: a fresh
# Cloudflare account has no workers.dev subdomain, and a route is a better
# endpoint anyway. Wrangler creates the proxied DNS record for this hostname
# on deploy - it touches only `sync`, not the apex or any other subdomain.
[[routes]]
pattern = "sync.devondoes.dev"
custom_domain = true

# Origins allowed to call this Worker. devontroedel.com is where the drill is
# served today; the devondoes.dev entries are here so moving it onto that zone
# later does not silently break sync. localhost is for the dev server.
[vars]
ALLOWED_ORIGINS = "https://devontroedel.com,https://devondoes.dev,https://www.devondoes.dev,https://drill.devondoes.dev,http://localhost:4321"

# The attempt log. One key, one small JSON blob.
# Create with:  npx wrangler kv namespace create DRILL
# then paste the returned id below.
[[kv_namespaces]]
binding = "DRILL"
id = "d63d1871fa664b9f8811449cfa9fd495"

# DRILL_KEY is a secret, never a var - set it with:
#   npx wrangler secret put DRILL_KEY
# Use the same access key the other private apps use, so one key unlocks
# everything on a given device.
